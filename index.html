<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Couple Compatibility ❤️</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3);
  color:#333;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:20px;
  padding:25px;
  margin-top:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}
h1{
  text-align:center;
  color:#e91e63;
}
h2{
  color:#e91e63;
}
input,button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border-radius:10px;
  font-size:16px;
}
input{
  border:1px solid #ccc;
}
button{
  border:0;
  background:#e91e63;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{
  background:#c2185b;
}
.option{
  display:block;
  background:#f8f8f8;
  border:1px solid #ddd;
  padding:13px;
  margin:10px 0;
  border-radius:10px;
  cursor:pointer;
}
.option:hover{
  background:#ffe4ec;
}
.option input{
  width:auto;
  margin-right:10px;
}
.question{
  margin-bottom:25px;
}
.hidden{display:none}
.room{
  text-align:center;
  background:#fff0f5;
  padding:15px;
  border-radius:12px;
  margin:15px 0;
}
.code{
  font-size:28px;
  font-weight:bold;
  color:#e91e63;
  letter-spacing:4px;
}
.progress{
  height:10px;
  background:#eee;
  border-radius:10px;
  overflow:hidden;
  margin:15px 0;
}
.progress-bar{
  height:100%;
  background:#e91e63;
  width:0%;
}
.result{
  text-align:center;
}
.score{
  font-size:55px;
  font-weight:bold;
  color:#e91e63;
}
.match{
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  background:#f5f5f5;
}
.good{background:#e8f5e9}
.no{background:#ffebee}
.small{
  font-size:13px;
  color:#777;
  text-align:center;
}
</style>
</head>
